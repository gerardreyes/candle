<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Candle Breath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-height night scene on top, one control panel underneath. Palette: near-black room, candle amber. */
:root{
  --bg:#08070a;
  --fg:#f4eadb;
  --muted:#a89a86;
  --accent:#ffb347;
  --accent-ink:#2a1700;
  --surface:#1d1812;
  --line:#2e261d;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
body{
  margin:0;height:100%;box-sizing:border-box;
  background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%;display:flex;flex-direction:column}
#stage{
  flex:1;min-height:0;position:relative;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
}
#stage canvas{display:block;width:100%;height:100%}
#panel{display:flex;flex-direction:column;gap:12px;padding:14px 0 16px;border-top:1px solid var(--line)}
#status{margin:0;min-height:2.9em;color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{
  font:inherit;font-weight:500;padding:11px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);
  cursor:pointer;touch-action:manipulation;
}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#blowBtn{-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
#blowBtn.down{background:#2a2218;border-color:var(--accent)}
.gauges{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.gauges label,.gauges .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;min-width:0;accent-color:var(--accent);margin:0}
#meter{position:relative;height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
#meterFill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--accent);border-radius:5px}
#meter .tick{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
</style>

<div id="app">
  <div id="stage" aria-label="A lit candle on a brass dish"></div>
  <section id="panel">
    <p id="status" role="status" aria-live="polite">Turn on the microphone, then blow on the candle.</p>
    <div class="row">
      <button id="micBtn" class="primary" type="button">Turn on microphone</button>
      <button id="lightBtn" type="button" disabled>Light candle</button>
      <button id="blowBtn" type="button">Hold to blow</button>
    </div>
    <div class="gauges">
      <label for="sens">Sensitivity</label>
      <input id="sens" type="range" min="0.5" max="2.5" step="0.1" value="1.4">
      <span class="lbl">Breath</span>
      <div id="meter"><i id="meterFill"></i><b class="tick"></b></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

var stage=document.getElementById("stage");
var statusEl=document.getElementById("status");
var micBtn=document.getElementById("micBtn");
var lightBtn=document.getElementById("lightBtn");
var blowBtn=document.getElementById("blowBtn");
var sensEl=document.getElementById("sens");
var fillEl=document.getElementById("meterFill");

function say(t){statusEl.textContent=t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smooth(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}

if(!window.THREE){say("The 3D library did not load. Check your connection and reload the page.");return}
var THREE=window.THREE;

var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}
catch(e){say("This browser cannot run WebGL, so the candle cannot be drawn.");return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x08070a,12,30);
var camera=new THREE.PerspectiveCamera(38,1,0.1,80);

/* ---------- small noise helpers (JS side) ---------- */
function hash1(n){var x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function vnoise(x){var i=Math.floor(x),f=x-i;f=f*f*(3-2*f);return hash1(i)*(1-f)+hash1(i+1)*f}
function flickerNoise(t){return vnoise(t*9)*0.5+vnoise(t*21+7)*0.3+vnoise(t*47+3)*0.2}

/* ---------- textures drawn on canvas ---------- */
function canvasTex(c){var t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t}
function roundTex(stops){
  var c=document.createElement("canvas");c.width=c.height=128;
  var g=c.getContext("2d");
  var gr=g.createRadialGradient(64,64,0,64,64,64);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return canvasTex(c);
}
function waxGlowTex(){
  var c=document.createElement("canvas");c.width=4;c.height=256;
  var g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,"#ffffff");gr.addColorStop(0.1,"#e2b87c");gr.addColorStop(0.35,"#5a3818");gr.addColorStop(0.65,"#0c0602");gr.addColorStop(1,"#000000");
  g.fillStyle=gr;g.fillRect(0,0,4,256);
  return canvasTex(c);
}
function waxBumpTex(){
  var W=128,Hh=256;
  var c=document.createElement("canvas");c.width=W;c.height=Hh;
  var g=c.getContext("2d");
  var im=g.createImageData(W,Hh);
  for(var y=0;y<Hh;y++)for(var x=0;x<W;x++){
    var v=128+10*Math.sin(x*0.9+3*Math.sin(y*0.03))+(Math.random()-0.5)*8;
    var k=(y*W+x)*4;
    im.data[k]=im.data[k+1]=im.data[k+2]=v;im.data[k+3]=255;
  }
  g.putImageData(im,0,0);
  var t=canvasTex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

var texGlow=roundTex([[0,"rgba(255,175,80,0.9)"],[0.3,"rgba(255,125,35,0.38)"],[1,"rgba(255,90,0,0)"]]);
var texHalo=roundTex([[0,"rgba(255,190,100,0.8)"],[0.3,"rgba(255,140,50,0.3)"],[1,"rgba(255,110,20,0)"]]);
var texSmoke=roundTex([[0,"rgba(255,255,255,0.6)"],[0.45,"rgba(255,255,255,0.2)"],[1,"rgba(255,255,255,0)"]]);
var texEmber=roundTex([[0,"rgba(255,210,120,1)"],[0.4,"rgba(255,110,20,0.6)"],[1,"rgba(255,60,0,0)"]]);
var texMote=roundTex([[0,"rgba(255,255,255,1)"],[0.4,"rgba(255,255,255,0.35)"],[1,"rgba(255,255,255,0)"]]);
var texShadow=roundTex([[0,"rgba(0,0,0,0.85)"],[0.55,"rgba(0,0,0,0.45)"],[1,"rgba(0,0,0,0)"]]);

/* ---------- reflections for the brass dish ---------- */
var envTex=null;
try{
  var ec=document.createElement("canvas");ec.width=256;ec.height=128;
  var eg=ec.getContext("2d");
  var eb=eg.createLinearGradient(0,0,0,128);
  eb.addColorStop(0,"#241810");eb.addColorStop(0.5,"#2e1f12");eb.addColorStop(1,"#0a0806");
  eg.fillStyle=eb;eg.fillRect(0,0,256,128);
  var ebl=eg.createRadialGradient(128,44,0,128,44,62);
  ebl.addColorStop(0,"rgba(255,205,125,1)");ebl.addColorStop(1,"rgba(255,140,40,0)");
  eg.fillStyle=ebl;eg.fillRect(0,0,256,128);
  var et=new THREE.CanvasTexture(ec);et.mapping=THREE.EquirectangularReflectionMapping;
  var pm=new THREE.PMREMGenerator(renderer);
  envTex=pm.fromEquirectangular(et).texture;
  pm.dispose();
}catch(e){envTex=null}

/* ---------- the room ---------- */
scene.add(new THREE.AmbientLight(0x3d3126,0.7));

var floor=new THREE.Mesh(
  new THREE.PlaneGeometry(90,90),
  new THREE.MeshStandardMaterial({color:0x1d150e,roughness:0.85,metalness:0})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

var contact=new THREE.Mesh(
  new THREE.PlaneGeometry(4.6,4.6),
  new THREE.MeshBasicMaterial({map:texShadow,transparent:true,depthWrite:false,opacity:0.8})
);
contact.rotation.x=-Math.PI/2;contact.position.y=0.003;
scene.add(contact);

/* brass dish: a lathe profile with a raised lip and a shallow well */
var plateMat=new THREE.MeshStandardMaterial({
  color:envTex?0xc9a25f:0xb08a4a,roughness:0.34,metalness:envTex?0.85:0.35,
  envMap:envTex,envMapIntensity:1,side:THREE.DoubleSide
});
var platePts=[[0,0],[1.2,0],[1.46,0.03],[1.56,0.1],[1.52,0.125],[1.4,0.085],[1.05,0.065],[0,0.065]]
  .map(function(p){return new THREE.Vector2(p[0],p[1])});
var plate=new THREE.Mesh(new THREE.LatheGeometry(platePts,96),plateMat);
scene.add(plate);

/* ---------- candle geometry ---------- */
var H=2.2,R=0.45;
var SPILL=Math.PI/2-0.35;                 /* the side where wax has run over the rim, facing the viewer */
var poolY=H-0.14;

function rimY(th){
  var d=Math.cos(th-SPILL);
  var dip=Math.pow(Math.max(0,d),3)*0.11;
  var wob=0.012*Math.sin(3*th+1)+0.008*Math.sin(5*th+2);
  return H-dip+wob;
}

var candle=new THREE.Group();
candle.position.y=0.065;
scene.add(candle);

var waxMat=new THREE.MeshStandardMaterial({
  color:0xf3e6c9,roughness:0.55,metalness:0,
  bumpMap:waxBumpTex(),bumpScale:0.1,
  emissive:0xffa050,emissiveMap:waxGlowTex(),emissiveIntensity:1
});

var bodyGeo=new THREE.CylinderGeometry(R,R,1,96,48,true);
bodyGeo.rotateY(Math.PI);                 /* put the seam at the back */
(function(){
  var pos=bodyGeo.attributes.position;
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    var th=Math.atan2(z,x),t=y+0.5;
    var rad=R*(1.02-0.035*t+0.012*Math.sin(4*th+t*6)+0.008*Math.sin(7*th-t*9));
    pos.setXYZ(i,Math.cos(th)*rad,t*rimY(th),Math.sin(th)*rad);
  }
  bodyGeo.computeVertexNormals();
})();
var body=new THREE.Mesh(bodyGeo,waxMat);
candle.add(body);

/* melted crater: a bowl of liquid wax inside a thick rim */
var topMat=new THREE.MeshStandardMaterial({
  vertexColors:true,roughness:0.28,metalness:0,
  emissive:0xffb458,emissiveIntensity:0.3,side:THREE.DoubleSide
});
(function(){
  var rings=18,segs=96,verts=[],cols=[],idx=[];
  var rimC=[0.82,0.78,0.7],poolC=[0.88,0.78,0.52];
  for(var j=0;j<=rings;j++){
    var u=j/rings,r=R*0.985*u*(1.02-0.035);
    for(var i=0;i<segs;i++){
      var th=i/segs*Math.PI*2;
      var rim=rimY(th);
      var bowl=poolY-0.025*Math.cos(th-SPILL);
      var y=bowl+(rim-bowl)*Math.pow(u,3.0)+0.02*Math.exp(-Math.pow((u-0.93)/0.05,2));
      verts.push(Math.cos(th)*r,y,Math.sin(th)*r);
      var m=smooth(0.55,0.88,u);
      cols.push(poolC[0]+(rimC[0]-poolC[0])*m,poolC[1]+(rimC[1]-poolC[1])*m,poolC[2]+(rimC[2]-poolC[2])*m);
    }
  }
  for(var j2=0;j2<rings;j2++)for(var i2=0;i2<segs;i2++){
    var i3=(i2+1)%segs;
    var a=j2*segs+i2,b=j2*segs+i3,c=(j2+1)*segs+i2,d=(j2+1)*segs+i3;
    idx.push(a,b,c,b,d,c);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute("color",new THREE.Float32BufferAttribute(cols,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  candle.add(new THREE.Mesh(g,topMat));
})();

/* wax puddle where the candle meets the dish */
var puddle=new THREE.Mesh(new THREE.CircleGeometry(0.66,64),new THREE.MeshStandardMaterial({color:0xa8956f,roughness:0.4,metalness:0,emissive:0xffa050,emissiveIntensity:0.08}));
puddle.rotation.x=-Math.PI/2;puddle.position.y=0.006;puddle.scale.set(1.04,0.94,1);
candle.add(puddle);

/* drips running down the wall from the spilled side */
var dripMat=new THREE.MeshStandardMaterial({color:0xf6ead0,roughness:0.4,metalness:0,emissive:0xffa050,emissiveIntensity:0.5});
function dripGeo(len){
  var p=[[0,-len-0.055],[0.03,-len-0.045],[0.06,-len],[0.062,-len*0.93],[0.04,-len*0.8],[0.045,-len*0.4],[0.05,0],[0,0.02]];
  return new THREE.LatheGeometry(p.map(function(q){return new THREE.Vector2(q[0],q[1])}),14);
}
[[0,1.0,1.5],[0.42,0.55,1],[-0.4,0.36,1],[0.95,0.25,1],[-1.1,0.6,1]].forEach(function(d){
  var th=SPILL+d[0];
  var g=new THREE.Mesh(dripGeo(d[1]),dripMat);
  g.position.set(Math.cos(th)*R*0.99,rimY(th)-0.01,Math.sin(th)*R*0.99);
  g.rotation.y=-th;
  g.scale.set(0.5,1,d[2]);
  candle.add(g);
});

/* curved, charred wick */
var wickMat=new THREE.MeshStandardMaterial({color:0x17120d,roughness:0.9,emissive:0xff5a10,emissiveIntensity:0});
var wickCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,poolY-0.03,0),new THREE.Vector3(0.004,poolY+0.1,0),
  new THREE.Vector3(0.02,poolY+0.2,0),new THREE.Vector3(0.05,poolY+0.27,0)
]);
candle.add(new THREE.Mesh(new THREE.TubeGeometry(wickCurve,16,0.017,8,false),wickMat));
var tipMat=new THREE.MeshStandardMaterial({color:0x17120d,roughness:0.9,emissive:0xff5a10,emissiveIntensity:0});
var wickTip=new THREE.Mesh(new THREE.SphereGeometry(0.026,10,8),tipMat);
wickTip.position.set(0.05,poolY+0.27,0);
candle.add(wickTip);

var tipX=0.05,tipY=poolY+0.27;            /* local to candle */
var worldTipY=candle.position.y+tipY;

/* ---------- the flame: a noise-driven shader on a tall quad ---------- */
var flameMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  uniforms:{uTime:{value:0},uLean:{value:0},uBlow:{value:0},uInt:{value:1}},
  vertexShader:[
    "uniform float uLean;uniform float uTime;uniform float uBlow;",
    "varying vec2 vUv;",
    "void main(){",
    "  vUv=uv;",
    "  vec3 p=position;",
    "  float h=uv.y;",
    "  p.x+=uLean*h*h+0.05*h*h*sin(uTime*7.0+h*3.0)*(0.5+uBlow*2.5);",
    "  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);",
    "}"
  ].join("\n"),
  fragmentShader:[
    "uniform float uTime;uniform float uInt;uniform float uBlow;",
    "varying vec2 vUv;",
    "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
    "float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);",
    "  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);}",
    "float fbm(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}return v;}",
    "void main(){",
    "  float y=vUv.y;float x=(vUv.x-0.5)*2.0;float t=uTime;",
    "  float turb=fbm(vec2(x*1.4,y*2.2-t*1.6))-0.5;",
    "  float xo=turb*0.55*y*(1.0+uBlow*1.5);",
    "  float yo=fbm(vec2(x*2.0+5.0,y*1.5-t*2.2))-0.5;",
    "  float yy=y+yo*0.06;",
    "  float w=0.8*sin(3.14159*pow(clamp(yy,0.0,1.0),0.55));",
    "  float dist=abs(x+xo)/max(w,0.02);",
    "  float body=1.0-smoothstep(0.35,1.0,dist);",
    "  body*=1.0-smoothstep(0.8,1.0,yy);",
    "  body*=smoothstep(0.0,0.04,yy);",
    "  float heat=clamp((1.0-dist)*(1.0-yy*0.75)*1.25,0.0,1.0);",
    "  vec3 red=vec3(0.75,0.12,0.0);vec3 orange=vec3(1.0,0.42,0.06);",
    "  vec3 yellow=vec3(1.0,0.78,0.28);vec3 white=vec3(1.0,0.96,0.82);vec3 blue=vec3(0.22,0.42,1.0);",
    "  vec3 col=mix(red,orange,smoothstep(0.0,0.3,heat));",
    "  col=mix(col,yellow,smoothstep(0.25,0.6,heat));",
    "  col=mix(col,white,smoothstep(0.6,0.95,heat));",
    "  float bm=(1.0-smoothstep(0.0,0.22,yy))*(1.0-smoothstep(0.2,0.9,dist));",
    "  col=mix(col,blue,bm*0.85);",
    "  gl_FragColor=vec4(col*(0.9+0.5*heat),body*uInt);",
    "}"
  ].join("\n")
});
var flame=new THREE.Mesh(new THREE.PlaneGeometry(0.5,1,1,24).translate(0,0.5,0),flameMat);
flame.position.set(tipX,tipY-0.03,0);
flame.renderOrder=4;
candle.add(flame);

function sprite(tex,size,order){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  s.scale.set(size,size,1);s.renderOrder=order;
  return s;
}
var glow=sprite(texGlow,6,1);
glow.position.set(tipX,tipY+0.4,0);candle.add(glow);
var halo=sprite(texHalo,1.4,2);
halo.position.set(tipX,tipY+0.36,0);candle.add(halo);
var ember=sprite(texEmber,0.3,6);
ember.material.opacity=0;
ember.position.set(tipX,tipY,0);candle.add(ember);

var flameLight=new THREE.PointLight(0xffa64d,1.6,15,2);
flameLight.position.set(tipX,worldTipY+0.55,0);
scene.add(flameLight);
var fillLight=new THREE.PointLight(0xff9a40,0.8,10,2);
fillLight.position.set(1.1,worldTipY+0.1,2.0);
scene.add(fillLight);

/* ---------- drifting dust in the candlelight ---------- */
var DN=38,dustPos=new Float32Array(DN*3),dustCol=new Float32Array(DN*3),dustSeed=[];
for(var di=0;di<DN;di++){
  dustPos[di*3]=(Math.random()-0.5)*5.5;
  dustPos[di*3+1]=0.6+Math.random()*4.2;
  dustPos[di*3+2]=(Math.random()-0.5)*4;
  dustSeed.push(Math.random()*6.28);
}
var dustGeo=new THREE.BufferGeometry();
dustGeo.setAttribute("position",new THREE.BufferAttribute(dustPos,3));
dustGeo.setAttribute("color",new THREE.BufferAttribute(dustCol,3));
var dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({
  size:0.09,map:texMote,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,
  depthWrite:false,sizeAttenuation:true,fog:false
}));
dust.frustumCulled=false;
scene.add(dust);

/* ---------- smoke ---------- */
var puffs=[];
function spawnSmoke(){
  var m=new THREE.SpriteMaterial({map:texSmoke,transparent:true,opacity:0,depthWrite:false,fog:false,color:0x9a9794});
  var s=new THREE.Sprite(m);
  s.position.set(tipX+(Math.random()-0.5)*0.02,worldTipY+0.05,(Math.random()-0.5)*0.02);
  s.scale.set(0.06,0.06,1);
  s.renderOrder=7;
  scene.add(s);
  puffs.push({s:s,age:0,life:3.6+Math.random()*2,vy:0.36+Math.random()*0.16,ph:Math.random()*6.28,r0:0.04+Math.random()*0.03});
}
function updateSmoke(dt){
  for(var i=puffs.length-1;i>=0;i--){
    var p=puffs[i];p.age+=dt;
    var k=p.age/p.life;
    if(k>=1){scene.remove(p.s);p.s.material.dispose();puffs.splice(i,1);continue}
    p.s.position.y+=p.vy*dt*(1-k*0.45);
    p.s.position.x+=(Math.sin(p.age*2.1+p.ph)*0.09*(0.3+k)+0.08*k)*dt;
    p.s.position.z+=Math.cos(p.age*1.7+p.ph)*0.05*dt;
    var sz=p.r0+k*0.55;
    p.s.scale.set(sz,sz*1.3,1);
    p.s.material.opacity=0.2*Math.min(1,p.age*5)*(1-k);
  }
}

/* ---------- state ---------- */
var isLit=true,litAmt=1;
var blowTarget=0,blowS=0,hold=0;
var smokeUntil=0,smokeAcc=0,emberT=0;
var holdBtn=false;

function light(){
  if(isLit)return;
  isLit=true;emberT=0;
  lightBtn.disabled=true;
  say(micOn?"Lit again. Blow to put it out.":"Lit again. Hold the blow button, or turn on the microphone.");
}
function extinguish(now){
  if(!isLit)return;
  isLit=false;smokeUntil=now+3.5;emberT=1;hold=0;
  lightBtn.disabled=false;
  say("Whoosh. The candle is out. Tap the candle or press Light candle to relight it.");
}

/* ---------- microphone ---------- */
var micOn=false,analyser=null,buf=null,ac=null,floorLvl=0.005,calib=0;

function enableMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    say("Microphone access is not available on this page. Use Hold to blow, or open the page over https in your phone's browser.");
    return;
  }
  micBtn.disabled=true;
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
  .then(function(stream){
    var AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    if(ac.resume)ac.resume();
    var src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser();
    analyser.fftSize=1024;analyser.smoothingTimeConstant=0;
    src.connect(analyser);
    buf=new Uint8Array(analyser.fftSize);
    micOn=true;calib=0.8;floorLvl=0.005;
    micBtn.textContent="Microphone on";
    say("Listening. Stay quiet for a second while it measures the room.");
  })
  .catch(function(){
    micBtn.disabled=false;
    say("The microphone was blocked or is not available here. Use Hold to blow, or open the page over https and allow the microphone.");
  });
}
function readMic(dt){
  if(!analyser)return 0;
  analyser.getByteTimeDomainData(buf);
  var s=0;
  for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128;s+=v*v}
  var rms=Math.sqrt(s/buf.length);
  if(calib>0){
    floorLvl=Math.max(floorLvl,rms);
    calib-=dt;
    if(calib<=0)say(isLit?"Ready. Blow across the microphone at the bottom of your phone.":"Ready. Relight the candle, then blow.");
    return 0;
  }
  if(rms<floorLvl)floorLvl=floorLvl*0.97+rms*0.03;
  var sens=parseFloat(sensEl.value)||1;
  return clamp((rms-floorLvl-0.015)/(0.2/sens),0,1.3);
}

/* ---------- controls ---------- */
micBtn.addEventListener("click",enableMic);
lightBtn.addEventListener("click",light);
stage.addEventListener("click",function(){if(!isLit)light()});
function setHold(v){holdBtn=v;blowBtn.classList.toggle("down",v)}
blowBtn.addEventListener("pointerdown",function(e){e.preventDefault();setHold(true)});
["pointerup","pointercancel","pointerleave"].forEach(function(n){blowBtn.addEventListener(n,function(){setHold(false)})});
blowBtn.addEventListener("contextmenu",function(e){e.preventDefault()});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"&&!e.repeat&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="INPUT"){e.preventDefault();setHold(true)}
});
window.addEventListener("keyup",function(e){if(e.code==="Space")setHold(false)});
window.addEventListener("blur",function(){setHold(false)});

/* ---------- sizing ---------- */
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  var d=Math.max(7.6,4.4/(0.6887*camera.aspect));
  camera.position.set(0,2.2+d*0.22,d);
  camera.lookAt(0,1.75,0);
  camera.updateProjectionMatrix();
  scene.fog.near=d+5;scene.fog.far=d+21;
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener("resize",resize);
resize();

/* ---------- loop ---------- */
var clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=clock.elapsedTime;

  var mic=readMic(dt);
  blowTarget=Math.max(mic,holdBtn?0.85:0);
  var rate=blowTarget>blowS?18:6;
  blowS+=(blowTarget-blowS)*Math.min(1,dt*rate);
  fillEl.style.width=(clamp(blowS,0,1)*100).toFixed(1)+"%";

  if(isLit){
    if(blowS>0.5)hold+=dt;else hold=Math.max(0,hold-dt*2);
    if(hold>0.3)extinguish(t);
  }

  if(isLit)litAmt=Math.min(1,litAmt+dt*2.2);
  else litAmt=Math.max(0,litAmt-dt*4.5);

  var fl=flickerNoise(t);                       /* about 0.5 on average */
  var flick=0.78+0.44*fl;                       /* about 1 on average */
  var sway=0.05*Math.sin(t*5.1)+0.03*Math.sin(t*8.7);
  var lean=blowS*0.42+sway;

  var u=flameMat.uniforms;
  u.uTime.value=t;
  u.uBlow.value=blowS;
  u.uLean.value=lean;
  u.uInt.value=litAmt;
  flame.visible=litAmt>0.02;
  var grow=0.35+0.65*litAmt;
  flame.scale.set(
    0.9*(1+0.25*blowS)*grow*(0.96+0.06*fl),
    0.88*(0.9+0.2*fl)*(1-0.4*blowS)*grow,
    1
  );

  glow.material.opacity=0.42*litAmt*(0.88+0.24*fl);
  halo.material.opacity=0.5*litAmt*(0.9+0.2*fl);
  halo.scale.setScalar(1.4*(0.94+0.12*fl));

  flameLight.intensity=1.35*litAmt*flick+0.25*emberT;
  fillLight.intensity=0.8*litAmt*flick;
  var em=litAmt*(0.85+0.3*fl);
  waxMat.emissiveIntensity=em;
  topMat.emissiveIntensity=0.3*em;
  dripMat.emissiveIntensity=0.5*em;
  puddle.material.emissiveIntensity=0.08*em;
  plateMat.envMapIntensity=1.15*litAmt+0.04;
  contact.material.opacity=0.8;

  if(!isLit){
    emberT=Math.max(0,emberT-dt*0.33);
    var pulse=0.75+0.25*Math.sin(t*9);
    ember.material.opacity=emberT*pulse;
    wickMat.emissiveIntensity=emberT*pulse*0.4;
    tipMat.emissiveIntensity=emberT*pulse*1.3;
    if(t<smokeUntil){
      smokeAcc+=dt*26*((smokeUntil-t)/3.5);
      while(smokeAcc>=1){smokeAcc-=1;spawnSmoke()}
    }
  }else{
    ember.material.opacity=0;
    wickMat.emissiveIntensity=0;
    tipMat.emissiveIntensity=0.5*litAmt;
  }
  updateSmoke(dt);

  for(var i=0;i<DN;i++){
    var s=dustSeed[i];
    dustPos[i*3]+=Math.sin(t*0.3+s)*dt*0.05;
    dustPos[i*3+1]+=dt*(0.035+0.02*Math.sin(s+t*0.2));
    if(dustPos[i*3+1]>5.2)dustPos[i*3+1]=0.5;
    var dx=dustPos[i*3],dy=dustPos[i*3+1]-worldTipY-0.3,dz=dustPos[i*3+2];
    var b=litAmt*0.9/(1+(dx*dx+dy*dy+dz*dz)*0.9)*(0.7+0.3*Math.sin(t*1.3+s*3));
    dustCol[i*3]=1*b;dustCol[i*3+1]=0.72*b;dustCol[i*3+2]=0.42*b;
  }
  dustGeo.attributes.position.needsUpdate=true;
  dustGeo.attributes.color.needsUpdate=true;

  renderer.render(scene,camera);
}
frame();
})();
</script>
